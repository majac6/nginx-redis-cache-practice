name: Deploy App A

on:
  push:
    branches: ["main"]
    paths:
      # app-a와 관련된 코드가 바뀔 때만 실행
      - "apps/app-a/**"
      - "packages/**" # 공통 패키지 변경 시에도 재배포 필요
      - ".github/workflows/deploy-app-a.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "k8s/app-a/deployment.yaml"
  # [추가] 수동 실행 버튼 활성화
  workflow_dispatch:

# [추가] 이 부분이 있어야 봇이 git push를 할 수 있습니다!
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # [핵심] 여기서 도커 이미지를 빌드하고 푸시합니다.
      # 이 단계가 실행될 때 Dockerfile 내부의 'RUN turbo prune...'과 'RUN pnpm build...'가 작동합니다.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: . # 프로젝트 루트 디렉토리를 컨텍스트로 지정 (중요!)
          file: apps/app-a/Dockerfile # app-a의 Dockerfile 경로
          push: true
          tags: registry.polymorph.co.kr/app-a:${{ github.sha }}
          provenance: false
          sbom: false

      # polymorph-k8s 저장소의 이미지 태그 업데이트                                                                                              
      - name: Update image tag in polymorph-k8s                                                                                                  
        run: |                                                                                                                                   
          git clone https://x-access-token:${{ secrets.POLYMORPH_K8S_TOKEN }}@github.com/polym-team/polymorph-k8s.git                            
          cd polymorph-k8s                                                                                                                     
                                                                                                                                                
          git config user.email "github-actions@github.com"                                                                                      
          git config user.name "GitHub Actions"                                                                                                  
                                                                                                                                                
          # app-a 디렉토리의 deployment.yaml 이미지 태그 수정                                                                                    
          sed -i "s|image: registry.polymorph.co.kr/app-a:.*|image: registry.polymorph.co.kr/app-a:${{ github.sha }}|g" manifests/app-a/deployment.yaml    

          git add manifests/app-a/deployment.yaml                                                                                                          
          git commit -m "chore(app-a): update image to ${{ github.sha }}"                                                                        
          git push