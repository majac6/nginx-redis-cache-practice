name: Deploy Prerender

on:
  push:
    branches: ["main"]
    paths:
      # prerender 관련 코드 변경 시
      - "packages/prerender/**"
      - "packages/**" # 공통 패키지 변경
      - "k8s/prerender/**"
      - ".github/workflows/deploy-prerender.yaml"
      - "package.json"
      - "pnpm-lock.yaml"

  # 수동 실행
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Docker Hub 로그인
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # prerender 이미지 빌드 & 푸시
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: . # 루트 컨텍스트 (monorepo 핵심)
          file: packages/prerender/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/prerender:${{ github.sha }}

      # K8s Manifest 업데이트 (ArgoCD 트리거)
      - name: Update Kubernetes Manifest
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/prerender:${{ github.sha }}|g" k8s/prerender/deployment.yaml

          git add k8s/prerender/deployment.yaml
          git commit -m "[CI/CD] Update prerender image to ${{ github.sha }}"
          git push
