apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: vhcns5/app-a:a4a3a2d4989f06e6c5584307ab05a5567e12b8b2
          ports:
            - containerPort: 3000
