apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  replicas: 8
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
      - name: app-a
        image: vhcns5/app-a:d01340cbc05492c1a0862f0c7f98b4fcf1f1a170
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: app-a-svc
  namespace: apps
spec:
  selector:
    app: app-a
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-a-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /app-a  # localhost:8081/app-a 로 접근
        pathType: Prefix
        backend:
          service:
            name: app-a-svc
            port:
              number: 80