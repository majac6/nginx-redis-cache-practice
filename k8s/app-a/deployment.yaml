apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  replicas: 8
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: vhcns5/app-a:48eeda5d52d08b026d4f15dbfc76ac05148cc15e
          ports:
            - containerPort: 3000
          # [추가] 환경변수 주입 (Redis 연결 정보)
          env:
            - name: REDIS_URL
              # 쿠버네티스 내부 DNS 주소 조합 (redis://:비번@호스트:포트)
              value: "redis://:local-dev-redis@redis-master.redis.svc.cluster.local:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: app-a-svc
  namespace: apps
spec:
  selector:
    app: app-a
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-a-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /app-a # localhost:8081/app-a 로 접근
            pathType: Prefix
            backend:
              service:
                name: app-a-svc
                port:
                  number: 80
