apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a-test
  namespace: my-test-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a-test
  template:
    metadata:
      labels:
        app: app-a-test
    spec:
      containers:
        - name: app-a-test
          image: vhcns5/app-a:c8cb7a5aa709d4dd3d24079d5f35855e1eee8421
          ports:
            - containerPort: 3000
