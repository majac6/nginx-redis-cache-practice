apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: vhcns5/app-a:5148b48302d3e92b75497d959b72977dad2da4c6
          ports:
            - containerPort: 3000
