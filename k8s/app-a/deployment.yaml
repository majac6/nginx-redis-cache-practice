apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-a
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-a
  template:
    metadata:
      labels:
        app: app-a
    spec:
      containers:
        - name: app-a
          image: vhcns5/app-a:77db3617ac64f72c3866e0d62604802c3b286d35
          ports:
            - containerPort: 3000
