apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-a-test
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/majac6/nginx-redis-cache-practice.git
    targetRevision: main
    path: k8s/app-a

  destination:
    server: https://kubernetes.default.svc
    namespace: my-test-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
