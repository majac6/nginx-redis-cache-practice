apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prerender-ingress
  namespace: apps
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /prerender
        pathType: Prefix
        backend:
          service:
            name: pkg-prerender-svc
            port:
              number: 4000
