apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prerender-ingress
  namespace: apps
spec:
  ingressClassName: nginx

  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prerender-svc
                port:
                  number: 80
