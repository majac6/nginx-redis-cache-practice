apiVersion: apps/v1
kind: Deployment
metadata:
  name: prerender
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prerender
  template:
    metadata:
      labels:
        app: prerender
    spec:
      containers:
        - name: prerender
          image: prerender:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_URL
            - name: PRERENDER_CACHE_PREFIX
              value: "prerender:"
